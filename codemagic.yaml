# The manual workflow stays usable without a GitHub publishing credential. Automated
# tag releases use a separate workflow so a missing credential cannot break it.
definitions:
  environment: &ios_environment
    java: 21
    xcode: "26.6"
    vars:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2'
  cache: &ios_cache
    cache_paths:
      - $HOME/.gradle/caches/modules-2
      - $HOME/.gradle/wrapper
      - $HOME/.konan
      - $HOME/.cargo/registry
      - $HOME/.cargo/git
      - native/ios-network/target
  scripts:
    prepare: &prepare
      name: Prepare the multiplatform build
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        export DEVELOPER_DIR="${DEVELOPER_DIR:-$(xcode-select -p)}"
        test "$(uname -m)" = arm64
        test -d "$DEVELOPER_DIR"
        chmod +x gradlew
        sdk_dir="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
        test -d "$sdk_dir"
        printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties
        java -version
        xcodebuild -version
        sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
        if [[ ! "$sdk_version" =~ ^([0-9]+)\. ]] || (( ${BASH_REMATCH[1]} < 26 )); then
          echo "iOS SDK 26 or newer is required; selected $sdk_version." >&2
          exit 1
        fi
    release_tag: &release_tag
      name: Check release tag and app version
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        tag="${CM_TAG:?This workflow must be started by a tag webhook}"
        [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*(-(test|dev|ios-test)\.[0-9]+)?$ ]]
        version=$(sed -n 's/^nodyssey\.versionName=//p' gradle.properties | head -1)
        code=$(sed -n 's/^nodyssey\.versionCode=//p' gradle.properties | head -1)
        test "$tag" = "v$version"
        [[ "$code" =~ ^[1-9][0-9]*$ ]]
        : "${GH_TOKEN:?Set GH_TOKEN in the Codemagic github_release group}"
        : "${CM_REPO_SLUG:?The GitHub repository is required}"
        gh auth status
    network_test: &network_test
      name: Prepare and test the pinned DoH ECH network core
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        if ! command -v rustup >/dev/null 2>&1; then
          mkdir -p "$CM_BUILD_DIR/build"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://sh.rustup.rs -o "$CM_BUILD_DIR/build/rustup-init.sh"
          sh "$CM_BUILD_DIR/build/rustup-init.sh" -y --profile minimal --default-toolchain none
        fi
        cd native/ios-network
        rustup show
        cargo fmt --check
        cargo test --locked
    native_test: &native_test
      name: Run the shared Kotlin Native tests
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        export DEVELOPER_DIR="${DEVELOPER_DIR:-$(xcode-select -p)}"
        ./gradlew :shared:macosArm64Test --max-workers=1
    simulator_test: &simulator_test
      name: Test native controls and iOS navigation on the ARM simulator
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        export DEVELOPER_DIR="${DEVELOPER_DIR:-$(xcode-select -p)}"
        ./gradlew :designsys:iosSimulatorArm64Test :ui:iosSimulatorArm64Test --max-workers=1
    archive: &archive
      name: Build and verify the unsigned iPhone IPA
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        export DEVELOPER_DIR="${DEVELOPER_DIR:-$(xcode-select -p)}"
        ./gradlew --stop
        export GRADLE_OPTS='-Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=1'
        version=$(sed -n 's/^nodyssey\.versionName=//p' gradle.properties | head -1)
        code=$(sed -n 's/^nodyssey\.versionCode=//p' gradle.properties | head -1)
        [[ "$version" =~ ^[0-9]+(\.[0-9]+)*([.-][A-Za-z0-9.-]+)?$ ]]
        [[ "$code" =~ ^[1-9][0-9]*$ ]]
        output="$CM_BUILD_DIR/build/ios-unsigned"
        mkdir -p "$output"
        xcodebuild \
          -project iosapp/Nodyssey.xcodeproj \
          -scheme Nodyssey \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath "$output/Nodyssey.xcarchive" \
          archive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          MARKETING_VERSION="$version" \
          CURRENT_PROJECT_VERSION="$code" 2>&1 | tee "$output/xcodebuild.log"
        app="$output/Nodyssey.xcarchive/Products/Applications/Nodyssey.app"
        test -d "$app"
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = "$version"
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = "$code"
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'io.github.nodyssey'
        executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
        test "$(lipo -archs "$app/$executable")" = 'arm64'
        sdk_name=$(/usr/libexec/PlistBuddy -c 'Print DTSDKName' "$app/Info.plist")
        if [[ ! "$sdk_name" =~ ^iphoneos([0-9]+)\. ]] || (( ${BASH_REMATCH[1]} < 26 )); then
          echo "iOS SDK 26 or newer is required in the app; found $sdk_name." >&2
          exit 1
        fi
        xcrun vtool -show-build "$app/$executable" | tee "$output/binary-platform.txt"
        grep -Eq '^[[:space:]]*platform IOS$' "$output/binary-platform.txt"
        binary_sdk=$(awk '$1 == "sdk" { print $2 }' "$output/binary-platform.txt")
        if [[ ! "$binary_sdk" =~ ^([0-9]+)\. ]] || (( ${BASH_REMATCH[1]} < 26 )); then
          echo "iOS SDK 26 or newer is required in the binary; found $binary_sdk." >&2
          exit 1
        fi
        python3 .github/scripts/native-network-notices.py "$app/NativeNetworkLicenses.txt"
        mkdir -p "$output/Payload"
        cp -R "$app" "$output/Payload/"
        name="nodyssey-$version.ipa"
        (cd "$output" && zip -qry "$name" Payload)
        unzip -t "$output/$name" > "$output/ipa-zip-check.txt"
        git rev-parse HEAD > "$output/source-commit.txt"
        printf 'version=%s\nbuild=%s\nsdk=%s\nsource=%s\nsigning=unsigned\nhost=arm64\n' \
          "$version" "$code" "$sdk_name" "$(git rev-parse HEAD)" > "$output/build-info.txt"
        (cd "$output" && shasum -a 256 "$name" > SHA256SUMS.txt)
    simulator_app: &simulator_app
      name: Build and verify the iOS Simulator App Preview
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        export DEVELOPER_DIR="${DEVELOPER_DIR:-$(xcode-select -p)}"
        export GRADLE_OPTS='-Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=1'
        bash .github/scripts/build-ios-simulator.sh "$CM_BUILD_DIR/build/ios-simulator"
    stop: &stop
      name: Stop Gradle
      script: ./gradlew --stop

workflows:
  ios-checks:
    name: Nodyssey iOS native regression
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment: *ios_environment
    cache: *ios_cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: dev
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - *prepare
      - *network_test
      - *native_test
      - *simulator_test
    artifacts:
      - shared/build/test-results/macosArm64Test/*.xml
      - designsys/build/test-results/iosSimulatorArm64Test/**
      - designsys/build/reports/tests/iosSimulatorArm64Test/**
      - ui/build/test-results/iosSimulatorArm64Test/**
      - ui/build/reports/tests/iosSimulatorArm64Test/**
    publishing:
      scripts:
        - *stop

  ios-unsigned:
    name: Nodyssey iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment: *ios_environment
    cache: *ios_cache
    scripts:
      - *prepare
      - *network_test
      - *native_test
      - *simulator_test
      - *archive
      - *simulator_app
    artifacts: &ios_artifacts
      - build/ios-unsigned/*.ipa
      - build/ios-unsigned/*.txt
      - build/ios-unsigned/xcodebuild.log
      - build/ios-simulator/Nodyssey.app
      - build/ios-simulator/*.zip
      - build/ios-simulator/*.txt
      - build/ios-simulator/xcodebuild.log
      - shared/build/test-results/macosArm64Test/*.xml
      - designsys/build/test-results/iosSimulatorArm64Test/**
      - designsys/build/reports/tests/iosSimulatorArm64Test/**
      - ui/build/test-results/iosSimulatorArm64Test/**
      - native/ios-network/rust-toolchain.toml
    publishing:
      scripts:
        - *stop

  ios-release:
    name: Nodyssey iOS tag release
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      <<: *ios_environment
      groups:
        - github_release
    cache: *ios_cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - *release_tag
      - *prepare
      - *network_test
      - *native_test
      - *simulator_test
      - *archive
      - *simulator_app
      - name: Attach iOS artifacts to the GitHub release
        script: python3 .github/scripts/publish-codemagic-ios.py
    artifacts: *ios_artifacts
    publishing:
      scripts:
        - *stop
