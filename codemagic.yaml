# Start this workflow manually in Codemagic. No signing credentials are required;
# the resulting device IPA is intended for users to sign before installing.
workflows:
  ios-unsigned:
    name: Nodyssey iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 21
      xcode: "26.6"
      vars:
        GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2'
    cache:
      cache_paths:
        - $HOME/.gradle/caches/modules-2
        - $HOME/.gradle/wrapper
        - $HOME/.konan
    scripts:
      - name: Prepare the multiplatform build
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          chmod +x gradlew
          sdk_dir="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          test -d "$sdk_dir"
          printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties
          # Android plugins need an SDK directory during KMP configuration.
          # Native tests and the iOS archive do not build an Android target,
          # so use the preinstalled SDK without installing Android platforms.
          java -version
          xcodebuild -version
      - name: Run the shared Kotlin Native tests
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          ./gradlew :shared:macosArm64Test --max-workers=2
      - name: Build and verify the unsigned iPhone IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          version=$(sed -n 's/^nodyssey\.versionName=//p' gradle.properties | head -1)
          code=$(sed -n 's/^nodyssey\.versionCode=//p' gradle.properties | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$code" =~ ^[1-9][0-9]*$ ]]
          output="$CM_BUILD_DIR/build/ios-unsigned"
          mkdir -p "$output"
          xcodebuild \
            -project iosapp/Nodyssey.xcodeproj \
            -scheme Nodyssey \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$output/Nodyssey.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$code" 2>&1 | tee "$output/xcodebuild.log"
          app="$output/Nodyssey.xcarchive/Products/Applications/Nodyssey.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = "$code"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'io.github.nodyssey'
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          test "$(lipo -archs "$app/$executable")" = 'arm64'
          mkdir -p "$output/Payload"
          cp -R "$app" "$output/Payload/"
          name="nodyssey-$version.ipa"
          (cd "$output" && zip -qry "$name" Payload)
          unzip -t "$output/$name" > "$output/ipa-zip-check.txt"
          git rev-parse HEAD > "$output/source-commit.txt"
          printf 'version=%s\nbuild=%s\nsigning=unsigned\n' "$version" "$code" > "$output/build-info.txt"
          (cd "$output" && shasum -a 256 "$name" > SHA256SUMS.txt)
    artifacts:
      - build/ios-unsigned/*.ipa
      - build/ios-unsigned/*.txt
      - build/ios-unsigned/xcodebuild.log
      - shared/build/test-results/macosArm64Test/*.xml
    publishing:
      scripts:
        - name: Stop Gradle
          script: ./gradlew --stop
