name: iPad real app regression
on:
  workflow_dispatch:
    inputs:
      platform:
        default: ios
      ios_runner:
        default: macos-15
permissions:
  contents: read
jobs:
  regression:
    runs-on: ${{ inputs.ios_runner }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/ios-network/target
          key: native-network-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/ios-network/Cargo.lock', 'native/ios-network/rust-toolchain.toml') }}
      - name: Test UIKit containment and shared native code
        run: ./gradlew spotlessCheck :ui:iosSimulatorArm64Test :shared:macosArm64Test --max-workers=2
      - name: Build the real simulator app
        run: bash .github/scripts/build-ios-simulator.sh "$RUNNER_TEMP/simulator"
      - name: Rotate the real app on 11 and 13 inch iPads
        run: python3 .github/scripts/test-ios-ipad.py "$RUNNER_TEMP/simulator/Nodyssey.app" "$RUNNER_TEMP/ipad-smoke"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ipad-regression
          path: |
            ${{ runner.temp }}/ipad-smoke/
            ${{ runner.temp }}/simulator/*.txt
            ${{ runner.temp }}/simulator/*.log
            ui/build/test-results/iosSimulatorArm64Test/
            shared/build/test-results/macosArm64Test/
      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop
