name: iPad full simulator probe
on:
  workflow_dispatch:
    inputs:
      platform:
        default: ios
      ios_runner:
        default: macos-26
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/ipad-native-probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ipad-full-simulator-probe
          path: |
            ${{ runner.temp }}/ipad-real/*.log
            ${{ runner.temp }}/ipad-real/*.png
