name: iPad visible app verification
on:
  workflow_dispatch:
    inputs:
      platform:
        default: ios
      ios_runner:
        default: macos-26
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify detached views in a visible UIKit window
        run: python3 .github/scripts/ipad-native-probe.py
      - name: Test the packaged app on both iPad sizes
        run: python3 .github/scripts/ipad-delivery.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ipad-visible-verification
          path: |
            ${{ runner.temp }}/ipad-probe/*.json
            ${{ runner.temp }}/ipad-delivery/smoke/*.json
            ${{ runner.temp }}/ipad-delivery/smoke/*.log
