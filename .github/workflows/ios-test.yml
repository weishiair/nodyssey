name: Build Android and iOS test apps

on:
  push:
    branches: ['test/ios-doh-ech-1.3.4-test.2']
  workflow_dispatch:
    inputs:
      platform:
        description: Test packages to build
        type: choice
        options: [all, android, ios]
        default: all

permissions:
  contents: read

concurrency:
  group: test-apps-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Run the shared regression gates
        run: ./gradlew spotlessCheck testDebugUnitTest testAndroidHostTest jvmTest :app:lintDebug :app:assembleDebug :app:bundleRelease --max-workers=2
      - name: Test release helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check committed database schemas
        shell: bash
        run: |
          if test -n "$(git status --porcelain -uall -- '*/schemas/*')"; then
            echo '::error::Generated database schemas differ from the committed files.'
            exit 1
          fi
      - name: Collect validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-validation-${{ github.run_id }}
          path: |
            */build/reports/
            */build/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop

  android:
    if: inputs.platform != 'ios'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_VERSION: 1.3.4-test.10
      BUILD_CODE: '88'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Decode the existing Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build the signed Android test APK
        env:
          NODYSSEY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          NODYSSEY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NODYSSEY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NODYSSEY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pnodyssey.echRelease=true -Pnodyssey.versionName="$BUILD_VERSION" -Pnodyssey.versionCode="$BUILD_CODE" --max-workers=2
      - name: Verify the Android package and existing signing identity
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          output="$RUNNER_TEMP/android-test-dist"
          mkdir -p "$output"
          "$tools/aapt2" dump badging "$apk" > "$output/apk-badging.txt"
          grep -Fq "package: name='io.github.nodyssey.debug' versionCode='$BUILD_CODE' versionName='$BUILD_VERSION'" "$output/apk-badging.txt"
          if grep -q 'application-debuggable' "$output/apk-badging.txt"; then exit 1; fi
          "$tools/apksigner" verify --print-certs --verbose "$apk" > "$output/apk-signature.txt"
          grep -Fq 'certificate SHA-256 digest: 71218866231eae5bf61a1192b2df0180d6d65d55e6aa08f0e52176dbcad197f8' "$output/apk-signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$output/apk-signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$output/apk-signature.txt"
          "$tools/zipalign" -c -P 16 -v 4 "$apk" > "$output/apk-zipalign.txt"
          name="nodyssey-$BUILD_VERSION.apk"
          cp "$apk" "$output/$name"
          cp app/build/outputs/mapping/release/mapping.txt "$output/mapping-$BUILD_VERSION.txt"
          git rev-parse HEAD > "$output/source-commit.txt"
          printf 'version=%s\nbuild=%s\nplatform=Android\n' "$BUILD_VERSION" "$BUILD_CODE" > "$output/build-info.txt"
          (cd "$output" && sha256sum "$name" > SHA256SUMS.txt)
      - name: Upload the signed Android test APK
        uses: actions/upload-artifact@v7
        with:
          name: nodyssey-android-test-${{ github.run_id }}
          path: ${{ runner.temp }}/android-test-dist/
          retention-days: 14
          if-no-files-found: error
      - name: Remove the temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up the Android SDK for multiplatform configuration
        uses: android-actions/setup-android@v4
      - name: Cache the Kotlin Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Prepare the pinned native network toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/ios-network/target
          key: native-network-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/ios-network/Cargo.lock', 'native/ios-network/rust-toolchain.toml') }}
      - name: Test the pinned native network toolchain
        working-directory: native/ios-network
        run: |
          rustup show
          cargo test --locked
          cargo fmt --check
          cargo run --locked --example probe
      - name: Read the test version
        shell: bash
        run: |
          version=$(sed -n 's/^nodyssey\.versionName=//p' gradle.properties | head -1)
          code=$(sed -n 's/^nodyssey\.versionCode=//p' gradle.properties | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ios-test\.[0-9]+$ ]]
          [[ "$code" =~ ^[1-9][0-9]*$ ]]
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_CODE=$code" >> "$GITHUB_ENV"
      - name: Run common tests on Kotlin Native
        run: ./gradlew :shared:macosArm64Test --max-workers=2
      - name: Build the unsigned iPhone app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
        run: |
          xcodebuild \
            -project iosapp/Nodyssey.xcodeproj \
            -scheme Nodyssey \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nodyssey.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$BUILD_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_CODE"
      - name: Verify and package the IPA
        shell: bash
        run: |
          app="$RUNNER_TEMP/Nodyssey.xcarchive/Products/Applications/Nodyssey.app"
          test -d "$app"
          python3 .github/scripts/native-network-notices.py "$app/NativeNetworkLicenses.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = "$BUILD_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = "$BUILD_CODE"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'io.github.nodyssey'
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          test "$(lipo -archs "$app/$executable")" = 'arm64'
          mkdir -p "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/ios-test-dist"
          cp -R "$app" "$RUNNER_TEMP/Payload/"
          name="nodyssey-$BUILD_VERSION.ipa"
          (cd "$RUNNER_TEMP" && zip -qry "ios-test-dist/$name" Payload)
          unzip -t "$RUNNER_TEMP/ios-test-dist/$name" > "$RUNNER_TEMP/ipa-zip-check.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/ios-test-dist/source-commit.txt"
          printf 'version=%s\nbuild=%s\nsigning=unsigned\n' "$BUILD_VERSION" "$BUILD_CODE" > "$RUNNER_TEMP/ios-test-dist/build-info.txt"
          (cd "$RUNNER_TEMP/ios-test-dist" && shasum -a 256 "$name" > SHA256SUMS.txt)
      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: nodyssey-ios-test-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-test-dist/
          retention-days: 14
          if-no-files-found: error
      - name: Build and verify the iOS Simulator app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
        run: bash .github/scripts/build-ios-simulator.sh "$GITHUB_WORKSPACE/build/ios-simulator"
      - name: Upload the iOS Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: nodyssey-ios-simulator-${{ github.run_id }}
          path: |
            build/ios-simulator/*.zip
            build/ios-simulator/*.txt
            build/ios-simulator/xcodebuild.log
          retention-days: 14
          if-no-files-found: error
      - name: Collect Native test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-reports-${{ github.run_id }}
          path: |
            shared/build/reports/tests/macosArm64Test/
            shared/build/test-results/macosArm64Test/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop
