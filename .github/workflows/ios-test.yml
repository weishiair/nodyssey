name: iOS split diagnostic

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, android, ios]
        default: ios
      ios_runner:
        type: choice
        options: [macos-15, macos-26, macos-15-intel]
        default: macos-26

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/ios-network/target
          key: native-network-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/ios-network/Cargo.lock', 'native/ios-network/rust-toolchain.toml') }}
      - name: Run UIKit split tests
        run: ./gradlew :ui:iosSimulatorArm64Test --info --max-workers=2
      - name: Collect simulator crash details
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ipad-crashes"
          for dir in "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices"; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -mmin -15 \( -name '*.ips' -o -name '*.crash' \) -exec cp {} "$RUNNER_TEMP/ipad-crashes/" \; || true
            fi
          done
          xcrun simctl list devices booted > "$RUNNER_TEMP/ipad-crashes/devices.txt" || true
          xcrun simctl spawn booted log show --last 5m --style compact --predicate 'eventMessage CONTAINS "VISIBLE_CHECKPOINT" OR eventMessage CONTAINS "assertion failure" OR eventMessage CONTAINS "Terminating app"' > "$RUNNER_TEMP/ipad-crashes/simulator.log" 2>&1 || true
      - name: Upload UIKit test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipad-split-diagnostic-${{ github.run_id }}
          path: |
            ui/build/reports/tests/iosSimulatorArm64Test/
            ui/build/test-results/iosSimulatorArm64Test/
            ${{ runner.temp }}/ipad-crashes/
          if-no-files-found: warn
      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop
