name: iPad visible UIKit probe
on:
  workflow_dispatch:
    inputs:
      platform:
        default: ios
      ios_runner:
        default: macos-26
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/ipad-native-probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ipad-native-probe
          path: ${{ runner.temp }}/ipad-probe/*.json
