name: iOS tokenizer guard check

on:
  push:
    branches: ['test/ios-crash-fixes-1.3.4']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tokenizer-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tokenizer:
    # GitHub's standard macos-15 label is the macOS 15 arm64 image.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Log selected toolchain
        run: |
          xcodebuild -version
          uname -m
          test "$(uname -m)" = arm64
      - name: Run the standalone UIKit tokenizer regression first
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/tokenizer-logs"
          bash .github/scripts/test-ios-tokenizer-guard.sh "$RUNNER_TEMP/tokenizer-tests" 2>&1 | tee "$RUNNER_TEMP/tokenizer-logs/regression.log"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK for multiplatform configuration
        uses: android-actions/setup-android@v4
      - name: Cache the Kotlin Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Cache the pinned native network toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/ios-network/target
          key: native-network-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/ios-network/Cargo.lock', 'native/ios-network/rust-toolchain.toml') }}
      - name: Run shared Kotlin Native tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:macosArm64Test --max-workers=2 2>&1 | tee "$RUNNER_TEMP/tokenizer-logs/macos-test.log"
      - name: Build the integrated iOS Simulator app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
        run: bash .github/scripts/build-ios-simulator.sh "$RUNNER_TEMP/ios-simulator"
      - name: Collect logs and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tokenizer-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tokenizer-logs/*.log
            ${{ runner.temp }}/tokenizer-tests/**/*.log
            ${{ runner.temp }}/tokenizer-tests/**/*.txt
            ${{ runner.temp }}/tokenizer-tests/**/*.xml
            ${{ runner.temp }}/ios-simulator/xcodebuild.log
            ${{ runner.temp }}/ios-simulator/build-info.txt
            shared/build/test-results/macosArm64Test/**/*.xml
            shared/build/reports/tests/macosArm64Test/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop
